name: Deploy to GCP Cloud Run

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: "Deploy frontend after backend"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend and Frontend
    runs-on: ubuntu-latest
    environment:
      name: production

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      INSTANCE_CONNECTION_NAME: ${{ vars.GCP_INSTANCE_CONNECTION_NAME }}
      DB_SECRET_NAME: ${{ vars.GCP_DB_SECRET_NAME || 'air_q_db_password' }}
      DB_NAME: ${{ vars.GCP_DB_NAME || 'air_quality_db' }}
      DB_USER: ${{ vars.GCP_DB_USER || 'postgres' }}
      BACKEND_SERVICE: ${{ vars.GCP_BACKEND_SERVICE || 'air-q-backend' }}
      FRONTEND_SERVICE: ${{ vars.GCP_FRONTEND_SERVICE || 'air-q-frontend' }}
      BACKEND_SA: ${{ vars.GCP_BACKEND_SERVICE_ACCOUNT || 'air-q-backend-sa' }}
      FRONTEND_SA: ${{ vars.GCP_FRONTEND_SERVICE_ACCOUNT || 'air-q-frontend-sa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required variables
        run: |
          test -n "$PROJECT_ID" || (echo "Missing repo variable GCP_PROJECT_ID" && exit 1)
          test -n "$INSTANCE_CONNECTION_NAME" || (echo "Missing repo variable GCP_INSTANCE_CONNECTION_NAME" && exit 1)

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure gcloud project
        run: gcloud config set project "$PROJECT_ID"

      - name: Validate backend service account
        run: |
          gcloud iam service-accounts describe "$BACKEND_SA@$PROJECT_ID.iam.gserviceaccount.com" --project "$PROJECT_ID" >/dev/null

      - name: Validate frontend service account
        run: |
          gcloud iam service-accounts describe "$FRONTEND_SA@$PROJECT_ID.iam.gserviceaccount.com" --project "$PROJECT_ID" >/dev/null

      - name: Snapshot current Cloud Run revisions
        id: snapshot
        run: |
          BACKEND_PREV="$(gcloud run services describe "$BACKEND_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.latestReadyRevisionName)' || true)"
          FRONTEND_PREV="$(gcloud run services describe "$FRONTEND_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.latestReadyRevisionName)' || true)"
          echo "backend_prev=$BACKEND_PREV" >> "$GITHUB_OUTPUT"
          echo "frontend_prev=$FRONTEND_PREV" >> "$GITHUB_OUTPUT"
          echo "Previous backend revision: ${BACKEND_PREV:-none}"
          echo "Previous frontend revision: ${FRONTEND_PREV:-none}"

      - name: Deploy backend Cloud Run service
        run: |
          gcloud run deploy "$BACKEND_SERVICE" \
            --source apps/backend \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$BACKEND_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --add-cloudsql-instances "$INSTANCE_CONNECTION_NAME" \
            --set-build-env-vars "GOOGLE_RUNTIME_VERSION=3.13,GOOGLE_ENTRYPOINT=uvicorn app.main:app --host 0.0.0.0 --port 8080" \
            --allow-unauthenticated \
            --set-env-vars "POSTGRES_HOST=/cloudsql/$INSTANCE_CONNECTION_NAME,POSTGRES_PORT=5432,POSTGRES_DB=$DB_NAME,POSTGRES_USER=$DB_USER,POSTGRES_CONNECT_TIMEOUT=5,LOG_LEVEL=INFO" \
            --set-secrets "POSTGRES_PASSWORD=$DB_SECRET_NAME:latest"

      - name: Read backend URL
        id: backend_url
        run: |
          URL="$(gcloud run services describe "$BACKEND_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          test -n "$URL" || (echo "Cannot read backend URL" && exit 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $URL"

      - name: Deploy frontend Cloud Run service
        if: ${{ inputs.deploy_frontend }}
        run: |
          gcloud run deploy "$FRONTEND_SERVICE" \
            --source apps/frontend \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --service-account "$FRONTEND_SA@$PROJECT_ID.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --set-env-vars "BACKEND_URL=${{ steps.backend_url.outputs.url }}"

      - name: Read frontend URL
        id: frontend_url
        if: ${{ inputs.deploy_frontend }}
        run: |
          URL="$(gcloud run services describe "$FRONTEND_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          test -n "$URL" || (echo "Cannot read frontend URL" && exit 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Frontend URL: $URL"

      - name: Post-deploy health checks
        run: |
          set -euo pipefail

          retry_url() {
            local url="$1"
            local expected="$2"
            local attempts=10
            local sleep_seconds=8
            local body=""

            for attempt in $(seq 1 $attempts); do
              body="$(curl -sS "$url" || true)"
              if [[ "$body" == *"$expected"* ]]; then
                echo "Health check OK: $url"
                return 0
              fi
              echo "Attempt $attempt/$attempts failed for $url"
              sleep "$sleep_seconds"
            done

            echo "Health check failed for $url"
            echo "$body"
            return 1
          }

          retry_url "${{ steps.backend_url.outputs.url }}/health/ready" '"status":"ok"'

          if [[ "${{ inputs.deploy_frontend }}" == "true" ]]; then
            retry_url "${{ steps.frontend_url.outputs.url }}/api/v1/air-quality/latest" '"data"'
          fi

      - name: Roll back to previous revisions on failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail

          if [[ -n "${{ steps.snapshot.outputs.backend_prev }}" ]]; then
            gcloud run services update-traffic "$BACKEND_SERVICE" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --to-revisions "${{ steps.snapshot.outputs.backend_prev }}=100"
            echo "Rolled back backend to ${{ steps.snapshot.outputs.backend_prev }}"
          else
            echo "No previous backend revision found; skipping backend rollback"
          fi

          if [[ "${{ inputs.deploy_frontend }}" == "true" && -n "${{ steps.snapshot.outputs.frontend_prev }}" ]]; then
            gcloud run services update-traffic "$FRONTEND_SERVICE" \
              --region "$REGION" \
              --project "$PROJECT_ID" \
              --to-revisions "${{ steps.snapshot.outputs.frontend_prev }}=100"
            echo "Rolled back frontend to ${{ steps.snapshot.outputs.frontend_prev }}"
          else
            echo "No frontend rollback needed"
          fi
