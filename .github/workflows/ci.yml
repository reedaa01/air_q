name: CI

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - apps/backend/**
      - apps/frontend/**
      - etl/**
      - sql/**
      - requirements.txt
      - Dockerfile
      - docker-compose.yml
      - config.py
      - test_open_meteo.py
      - .github/workflows/ci.yml
      - tests/**


  pull_request:
    branches:
      - main
    paths:
      - apps/backend/**
      - apps/frontend/**
      - etl/**
      - sql/**
      - requirements.txt
      - Dockerfile
      - docker-compose.yml
      - config.py
      - test_open_meteo.py
      - .github/workflows/ci.yml
      - tests/**

  workflow_dispatch:
  
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  etl-test:
    name: Test ETL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall etl config.py

      - name: Run ETL tests
        run: python test_open_meteo.py

  backend-test:
    name: Test Backend API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/backend.[test]"

      - name: Run backend tests
        run: pytest -q apps/backend/tests

  frontend-quality:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - etl-test
      - backend-test
      - frontend-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ETL image
        run: docker build -t air-quality-etl:${{ github.sha }} .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ETL image
        run: docker build -t air-quality-etl:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: air-quality-etl:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/air-quality-etl:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/air-quality-etl:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/air-quality-etl:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/air-quality-etl:latest

