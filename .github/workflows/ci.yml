name: CI

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - etl/**
      - sql/**
      - requirements.txt
      - Dockerfile
      - docker-compose.yml
      - config.py
      - test_open_meteo.py
      - .github/workflows/ci.yml
      - tests/**


  pull_request:
    branches:
      - main
    paths:
      - etl/**
      - sql/**
      - requirements.txt
      - Dockerfile
      - docker-compose.yml
      - config.py
      - test_open_meteo.py
      - .github/workflows/ci.yml
      - tests/**

  workflow_dispatch:
  
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  test:
    name: Test ETL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall etl config.py

      - name: Run ETL tests
        run: python test_open_meteo.py

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ETL image
        run: docker build -t air-quality-etl:${{ github.sha }} .

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ETL image
        run: docker build -t air-quality-etl:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: air-quality-etl:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/air-quality-etl:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/air-quality-etl:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/air-quality-etl:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/air-quality-etl:latest

