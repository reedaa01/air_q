[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "air-quality-morocco-backend"
version = "0.1.0"
description = "Read-only API for the Morocco air quality dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "SQLAlchemy>=2.0.36,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "psycopg2-binary>=2.9,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
